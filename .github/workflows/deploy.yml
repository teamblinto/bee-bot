name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_fail:
        description: Fail the new release's health check on purpose to try the rollback (the run then fails)
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time, and one that started is never cut off: a newer push waits its turn.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: bash deploy/beebot-ci-deploy.test.sh
      - run: pnpm release:linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/beebot-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Runs no code from the repository: it only hands the built tarball to the host.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      # The host's forced command reads the tarball on stdin, installs or updates, and names the live
      # release last, whether the deploy worked or rolled back. Its exit code is this step's.
      - name: Deploy to the host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          COMMAND: ${{ inputs.force_fail && 'force-fail' || '' }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "::error::Set the secrets DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS and the variable DEPLOY_HOST in the production environment"
            exit 1
          fi
          ssh=$RUNNER_TEMP/ssh
          install -d -m 0700 "$ssh"
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" >"$ssh/key" && printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$ssh/known_hosts")
          tarball=$(echo beebot-*.tar.gz)
          ssh -i "$ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh/known_hosts" -o ServerAliveInterval=30 \
            "beebot-deploy@$DEPLOY_HOST" ${COMMAND:+"$COMMAND"} <"$tarball"
