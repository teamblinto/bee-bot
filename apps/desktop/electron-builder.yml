appId: com.teamblinto.beebot
productName: Bee Bot
extraMetadata:
  name: bee-bot
artifactName: Bee-Bot-${version}-${arch}.${ext}
npmRebuild: false
afterPack: scripts/check-box-image.mjs
directories:
  output: release
files:
  - dist-electron/**
  - from: ../server/dist
    to: server
  - from: ../web/dist
    to: web
extraResources:
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # What the server copies into the Podman machine, outside the asar so Podman can read it.
  - from: ../boxd/src
    to: box/apps/boxd/src
    filter: ["*.ts", "!*.test.ts"]
  - from: ../boxd/egress/dist/egress.mjs
    to: box/apps/boxd/egress/dist/egress.mjs
  - from: ../../images/box
    to: box/images/box
    # The Containerfile's build context (what .containerignore lets in), plus what the server reads.
    filter:
      - Containerfile
      - .containerignore
      - runSpec.json
      - seccomp-chromium.json
      - engine.sh
      - browser.sh
      - tmux.conf
      - chromium-policy.json
      - chromium.flags
      - "xfce/**/*"
win:
  target: nsis
  extraResources:
    - from: vendor/cua-driver/cua-driver.exe
      to: cua-driver/cua-driver.exe
