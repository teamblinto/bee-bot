appId: com.teamblinto.beebot
productName: Bee Bot
extraMetadata:
  name: bee-bot
artifactName: Bee-Bot-${version}-${arch}.${ext}
npmRebuild: false
directories:
  output: release
files:
  - dist-electron/**
  - from: ../server/dist
    to: server
  - from: ../web/dist
    to: web
extraResources:
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  target: nsis
