packages:
  - apps/*
  - packages/*
  - images/*

allowBuilds:
  # No install script since Electron 44. Keep the key: pnpm fails installs without it.
  electron: false
  electron-winstaller: false

catalog:
  "@tailwindcss/vite": 4.3.4
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/ws": 8.18.1
  croner: 10.0.1
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.4
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  ws: 8.22.1
  zod: 4.6.7

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.5.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.5.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.5.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.5.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.5.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.5.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.5.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.5.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.5.0"
  - electron@45.2.2
  - vite-plus@1.5.0

overrides:
  vite: "catalog:"
  vite-plus: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# pnpm 12 links agent skills that dependencies ship once approved; keep installs quiet.
permissions:
  "@tanstack/react-router":
    skills: false
  "@tanstack/router-plugin":
    skills: false
